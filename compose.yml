services:
  tubelab-api:
    image: ${TUBELAB_API_IMAGE:-tubelab-web-api:2026.10.09}
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8086}
    ports:
      - "127.0.0.1:${API_PORT:-8086}:3000"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 512m
    cpus: 1.0
